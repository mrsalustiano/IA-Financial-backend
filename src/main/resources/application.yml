spring:
  application:
    name: ia-financial
  data:
    mongodb:
      host: localhost
      port: 27017
      database: financial_control
      username: admin
      password: admin123
      authentication-database: admin
      auto-index-creation: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ollama:
  base-url: http://localhost:11434
  model: llama3
  timeout: 60s

logging:
  level:
    com.finance: INFO
