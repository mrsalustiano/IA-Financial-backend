spring:
  application:
    name: ia-financial
  data:
    mongodb:
      host: localhost
      port: 27017
      database: financial_control
      username: admin
      password: admin123
      authentication-database: admin
      auto-index-creation: false
  jackson:
    generator:
      write-bigdecimal-as-plain: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ollama:
  base-url: http://localhost:11434
  model: llama3
  timeout: 60s

app:
  monthly-closing:
    cron: "0 5 0 1 * *"

logging:
  level:
    com.finance: INFO
